services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dialer
      POSTGRES_PASSWORD: dialer
      POSTGRES_DB: dialer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialer -d dialer"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://dialer:dialer@postgres:5432/dialer
      MOCK_TELCO_URL: http://mock-telco:8001
      WEBHOOK_BASE_URL: http://backend:8000
      CORS_ORIGINS: http://localhost:5173,http://frontend:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-telco:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://dialer:dialer@postgres:5432/dialer
      MOCK_TELCO_URL: http://mock-telco:8001
      WEBHOOK_BASE_URL: http://backend:8000
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.workers.runtime

  worker2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://dialer:dialer@postgres:5432/dialer
      MOCK_TELCO_URL: http://mock-telco:8001
      WEBHOOK_BASE_URL: http://backend:8000
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.workers.runtime

  mock-telco:
    build:
      context: ./mock-telco
      dockerfile: Dockerfile
    environment:
      DIALER_WEBHOOK_BASE: http://backend:8000
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
